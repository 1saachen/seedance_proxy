[project]
name = "seedance-relay"
version = "0.1.0"
description = "A customer-scoped relay for Seedance video tasks"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "av>=14.4,<19",
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  "pillow>=11,<14",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.22,<1",
  "starlette>=0.47.3,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
